<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBS Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=1781717756">
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">MB<span>S</span></div>
      <div class="login-brand-text">
        <div class="login-title">Admin Panel</div>
        <div class="login-sub">CV Mahkota Berkah Semesta</div>
      </div>
    </div>
    <div class="login-body">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@mahkotaberkahsemesta.com" autocomplete="email">
      </div>
      <div class="field" style="margin-top:12px">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
            onkeydown="if(event.key==='Enter')doLogin()">
          <button class="pw-toggle" onclick="togglePw()" id="pwToggle" tabindex="-1">
            <svg id="pwEye" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <div id="loginError" class="login-error" style="display:none"></div>
      <button class="btn btn-gold" style="width:100%;margin-top:18px;justify-content:center" id="loginBtn" onclick="doLogin()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        Masuk
      </button>
    </div>
  </div>
</div>

<!-- ── MAIN APP (hidden until logged in) ── -->
<div id="appScreen" style="display:none">
  <div class="overlay" id="overlay" onclick="closeNav()"></div>
  <div class="shell" id="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <span class="m">MB<span class="g">S</span></span>
          <span class="brand-sub">admin<br>panel</span>
        </div>
        <button class="burger" onclick="closeNav()" aria-label="Tutup menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav class="nav" id="sidebarNav"></nav>
      <div class="side-foot">
        <div class="side-user" id="sideUser">
          <div class="side-user-avatar" id="sideUserAvatar">U</div>
          <div class="side-user-info">
            <div class="side-user-email" id="sideUserEmail">—</div>
            <div class="side-user-role">Administrator</div>
          </div>
        </div>
        <button class="logout-btn" onclick="doLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Keluar
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main" id="mainArea">
      <header class="topbar">
        <div class="topbar-left">
          <!-- Mobile burger -->
          <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu" title="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
          </button>

          <div class="page-title">
            <h1 id="pageH1">Dashboard</h1>
            <p id="pageP">Ringkasan bisnis &amp; keuangan</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="db-chip" id="dbChip"><span class="dot"></span><span id="dbText">…</span></div>
          <div class="avatar" id="topbarAvatar">MBS</div>
        </div>
      </header>
      <div id="pageContent"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Core -->
<script src="js/core.js?v=1781717756"></script>
<script src="js/app.js?v=1781717756"></script>
<!-- Pages -->
<script src="pages/pengaturan.js?v=1781717756"></script>
<script src="pages/dashboard.js?v=1781717756"></script>
<script src="pages/master-produk.js?v=1781717756"></script>
<script src="pages/master-klien.js?v=1781717756"></script>
<script src="pages/master-vendor.js?v=1781717756"></script>
<script src="pages/hpp-project.js?v=1781717756"></script>
<script src="pages/pengeluaran.js?v=1781717756"></script>
<script src="pages/laporan.js?v=1781717756"></script>
<script src="pages/invoice.js?v=1781717756"></script>
<script src="pages/quotation.js?v=1781717756"></script>
<script src="pages/po.js?v=1781717756"></script>
<script src="pages/suratjalan.js?v=1781717756"></script>
<script src="pages/desain-approval.js?v=1781717756"></script>

</body>
</html>
